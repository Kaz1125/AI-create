name: taskbar-pulse

on:
  push:
    paths: ["taskbar-pulse/**", ".github/workflows/taskbar-pulse.yml"]
  pull_request:
    paths: ["taskbar-pulse/**", ".github/workflows/taskbar-pulse.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: taskbar-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: taskbar-pulse
      - run: cargo build --release
      - name: Read version (major.minor) from Cargo.toml
        shell: bash
        run: echo "APP_VERSION=v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+)\.([0-9]+).*/\1.\2/')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-pulse-windows-x64-${{ env.APP_VERSION }}
          path: taskbar-pulse/target/release/taskbar-pulse.exe
